[tool.black]
line-length = 88
target-version = ['py38']
exclude = '''
/(
    venv|
    .venv|
    migrations|
    __pycache__|
    manage.py
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["venv", ".venv", "migrations"]

[tool.coverage.run]
source = ["apps/orders", "apps/storage_units", "apps/promo"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
