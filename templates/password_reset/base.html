{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Восстановление пароля{% endblock %} - SelfStorage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/Style.css' %}">
</head>

<body>
    <header class="navbar navbar-expand-xl navbar-light fixed-top bg-white py-5">
        <nav class="container">
            <a class="navbar-brand" href="{% url 'storage_units:index' %}">
                <img src="{% static 'img/Vector.svg' %}" alt="[]">
                <img src="{% static 'img/SelfStorage.svg' %}" alt="SelfStorage">
            </a>
        </nav>
    </header>

    <main class="container mt-header">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5 d-flex flex-column align-items-center text-center">
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>

    {% include 'footer.html' %}
    {% block modals %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
